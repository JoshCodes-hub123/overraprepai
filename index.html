    <!-- Early Theme Detection to prevent FOUC -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('overraprep-theme') || localStorage.getItem('theme');
          var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = t === 'dark' || (t !== 'light' && d) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Splash screens for iOS -->
    <style>
      /* Prevent pull-to-refresh on iOS */
      html, body {
        overscroll-behavior-y: none;

      /* ===== Pre-React boot splash (Deep charcoal + warm metallic gold) =====
         Visible immediately on first paint and stays up until React mounts. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483646;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, rgba(212, 175, 55, 0.14) 0%, #08080a 75%);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f5f5f7;
        transition: opacity .35s ease;
      }
      #boot-splash.is-hidden { opacity: 0; pointer-events: none; }
      #boot-splash .boot-orb {
        width: 84px; height: 84px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff6d6, #d4af37 55%, #5a4208 95%);
        box-shadow: 0 0 50px rgba(212, 175, 55, 0.4), 0 10px 30px rgba(0, 0, 0, 0.9);
        animation: bootFloat 2.4s ease-in-out infinite;
      }
      #boot-splash .boot-title {
        margin-top: 24px; font-weight: 700; font-size: 19px; letter-spacing: .12em; text-transform: uppercase;
        color: #f5f5f7;
      }
      #boot-splash .boot-sub {
        margin-top: 6px; font-size: 11px; color: #d4af37; letter-spacing: .22em; text-transform: uppercase; opacity: .88;
      }
      #boot-splash .boot-spinner {
        margin-top: 22px; width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37;
        animation: bootSpin .9s linear infinite;
      }
      #boot-fallback {
        display: none; max-width: 360px; margin-top: 26px; text-align: center;
        padding: 18px 20px; border-radius: 16px;
        background: rgba(18,18,22,.85); backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.25);
        box-shadow: 0 12px 40px rgba(0,0,0,.6);
      }
      #boot-fallback h2 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #f5f5f7; }
      #boot-fallback p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; opacity: .8; color: #d1d5db; }
      #boot-fallback button {
        appearance: none; border: 0; cursor: pointer;
        background: #d4af37; color: #08080a;
        padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px;
        letter-spacing: .04em;
      }
      #boot-fallback button:hover { background: #e5c158; }
      #boot-splash.is-lite .boot-orb {
        animation: none;
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.3);
      }
      .boot-lite-badge {
        display: none;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        padding: 4px 11px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid rgba(212, 175, 55, 0.35);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f5d77f;
      }
      .boot-lite-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #d4af37;
        box-shadow: 0 0 6px #d4af37;
      }
      @keyframes bootFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-8px) scale(1.03); }
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-orb, #boot-splash .boot-spinner { animation: none; }
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Pre-React splash. Removed by main.tsx once React mounts. -->
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading OverraPrep AI">
      <div class="boot-orb" aria-hidden="true"></div>
      <div class="boot-title">OverraPrep</div>
      <div class="boot-sub">Rise Beyond Limits.</div>
      <div id="boot-lite-badge" class="boot-lite-badge" aria-hidden="true">
        <span class="boot-lite-dot"></span>
        <span>Lite Mode · Fast Load</span>
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div id="boot-fallback">
        <h2>Hmm, that took a while.</h2>
        <p id="boot-fallback-msg">We couldn't finish loading the app. Check your connection and try again.</p>
        <button type="button" onclick="(function(){try{var u=new URL(window.location.href);u.searchParams.set('_cb',Date.now().toString(36));window.location.replace(u.toString());}catch(e){window.location.reload();}})()">Reload app</button>
      </div>
    </div>
    <script>
      (function detectConnection() {
        try {
          var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          var isSlow = false;
          if (conn) {
            if (conn.saveData) isSlow = true;
            var t = conn.effectiveType;
            if (t === 'slow-2g' || t === '2g' || t === '3g') isSlow = true;
            if (typeof conn.downlink === 'number' && conn.downlink < 1.8) isSlow = true;
            if (typeof conn.rtt === 'number' && conn.rtt > 400) isSlow = true;
          }
          if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)) {
            isSlow = true;
          }
          var stored = localStorage.getItem("overra:lite-mode");
          if (stored === "1" || (stored === null && isSlow)) {
            document.documentElement.classList.add("lite-mode");
            var splash = document.getElementById("boot-splash");
            if (splash) splash.classList.add("is-lite");
            var badge = document.getElementById("boot-lite-badge");
            if (badge) badge.style.display = "inline-flex";
            localStorage.setItem("overra:lite-mode:detected", "1");
          }
        } catch (e) {}
      })();
      (function () {
        // Reveal the fallback CTA if the app hasn't mounted within 25s,
        // or if a chunk fails to load. Prevents blank-screen lock-up.
        var FALLBACK_MS = 25000;
        var shown = false;
        function showFallback(msg) {
          if (shown) return; shown = true;
          var el = document.getElementById("boot-fallback");
          if (!el) return;
          if (msg) {
            var m = document.getElementById("boot-fallback-msg");
            if (m) m.textContent = msg;
          }
          el.style.display = "block";
        }
        // One-shot silent reload for chunk errors (stale deploy / dropped fetch)
        // before showing the fallback. Gated by sessionStorage to never loop.
        function softReloadOnce() {
          try {
            var k = "overra_boot_reload_at";
            var last = Number(sessionStorage.getItem(k) || 0);
            if (Date.now() - last > 60000) {
              sessionStorage.setItem(k, String(Date.now()));
              var u = new URL(window.location.href);
              u.searchParams.set("_cb", Date.now().toString(36));
              window.location.replace(u.toString());
              return true;
            }
          } catch (_) {}
          return false;
        }
        var timer = setTimeout(function () {
          if (!document.body.classList.contains("app-ready")) showFallback();
        }, FALLBACK_MS);
        window.__BOOT_FALLBACK__ = { show: showFallback, cancel: function () { clearTimeout(timer); } };
        var CHUNK_RE = /Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError|Loading chunk \d+ failed/i;
        window.addEventListener("error", function (e) {
          var msg = (e && e.message) || "";
          if (CHUNK_RE.test(msg)) {
            if (softReloadOnce()) return;
            showFallback("A new version is available or your connection dropped. Tap reload to continue.");
          }
        });
        window.addEventListener("unhandledrejection", function (e) {
          var msg = (e && e.reason && (e.reason.message || e.reason)) || "";
          if (CHUNK_RE.test(String(msg))) {
            if (softReloadOnce()) return;
            showFallback("A new version is available or your connection dropped. Tap reload to continue.");
          }
        });
      })();
    </script>
